name: Update GitHub Stats

on:
  schedule:
    - cron: '0/5 * * * *'
  workflow_dispatch: # 允许手动触发

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安装中文字体（用于 ECharts 渲染）
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-wqy-microhei fonts-wqy-zenhei
          fc-cache -fv
          echo "✅ 中文字体安装完成"

      - name: Install dependencies
        run: npm install

      - name: 清理旧的图片文件
        run: |
          if [ -d "images" ]; then
            echo "🗑️  清理旧的图片文件..."
            rm -f images/*.png
            echo "✅ 旧图片已清理"
          else
            echo "ℹ️  images 目录不存在，跳过清理"
          fi

      # 在仓库 Settings → Secrets 中添加 GH_STATS_PAT（classic: repo 范围；fine-grained: 可读私有仓）
      # 不设则只统计公开仓库；默认 GITHUB_TOKEN 无法枚举其它私有仓
      - name: Run stats script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_STATS_PAT: ${{ secrets.GH_STATS_PAT }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: npm start

      - name: 转换 ECharts 代码块为图片
        run: |
          echo "🖼️  开始转换 ECharts 代码块为图片..."
          node scripts/convert-echarts-to-images.js README.md images
          echo "✅ ECharts 转换完成"

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          git add images/ || true
          if ! git diff --staged --quiet; then
            git commit -m "📊 更新过去七天编程活动统计 [skip ci]"
            git push
            echo "✅ 已提交并推送更改"
          else
            echo "ℹ️ 没有变更需要提交"
          fi

